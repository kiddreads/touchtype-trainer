<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TypeAloud — Learn to Touch Type</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>⌨️ TypeAloud</h1>
  <div class="controls">
    <label>Lesson:
      <select id="lessonSelect"></select>
    </label>
    <button id="startBtn">Start</button>
    <button id="pauseBtn" hidden>Pause</button>
    <button id="modeToggle">👁️ See &amp; Type</button>
    <button id="contrastToggle">◑ High Contrast</button>
    <button id="easyReadToggle">Aa Easy Read</button>
    <label>Speed:
      <input type="range" id="rateSlider" min="0.5" max="1.3" step="0.1" value="0.9">
    </label>
    <select id="voiceSelect"></select>
  </div>
</header>

<main>
  <section class="lesson-info" id="lessonInfo">
    <h2 id="lessonTitle">Pick a lesson and press Start</h2>
    <p id="lessonDesc"></p>
    <div class="progress-bar"><div id="progressFill"></div></div>
  </section>

  <section class="stats" id="stats">
    <span>Accuracy: <b id="accuracyStat">100%</b></span>
    <span>WPM: <b id="wpmStat">0</b></span>
    <span>Words left: <b id="queueStat">0</b></span>
  </section>

  <section class="practice-area">
    <button id="replayBtn" title="Replay audio">🔊</button>
    <div id="wordDisplay" class="word-display" aria-live="polite"></div>
    <div id="listenHint" class="listen-hint" hidden>Listen carefully and type what you hear.</div>
  </section>

  <section class="keyboard" id="keyboard" aria-hidden="true"></section>
  <section class="finger-legend" id="fingerLegend"></section>

  <section class="dashboard" id="dashboard">
    <strong>Your progress</strong>
    <table id="dashboardTable"></table>
    <button id="resetProgressBtn">Reset all progress</button>
  </section>
</main>

<input id="typeCapture" class="sr-only" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1">

<footer>
  <p>Open source, multi-sensory touch-typing practice — audio, visible words, and adaptive repetition. MIT licensed.</p>
</footer>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
